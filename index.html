<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>mObywatel Downloader</title>

<style>
body{
    font-family: Arial;
    max-width:800px;
    margin:auto;
    padding:40px;
}

button{
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:300px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>mObywatel Downloader</h1>

<p>
Kliknij przycisk aby wygenerować kod.
</p>

<button onclick="generate()">
Generuj kod
</button>

<textarea id="output"></textarea>

<script>
function generate(){

document.getElementById("output").value =
`javascript:(function(){
alert("Downloader uruchomiony");
})();`;

}
</script>

</body>
</html>
<script src="downloader.js"></script>
